<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spread, Get the look</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#161514}a:hover{color:#9A5E48}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F7F2E9; color: #161514; font-family: Inter, system-ui, sans-serif;">
<div style="padding: 50px 20px 0;">

<header style="display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 44px;">
<button type="button" aria-label="Profile and settings" style="width: 34px; height: 34px; border-radius: 17px; border: 1px solid #161514; background: transparent; font: 500 13px Inter, sans-serif; color: #161514;">M</button>
<img src="/_blob/a841e02b9fa8bb0deeffbfafaa1b670a" alt="Caro" style="height: 28px; width: auto; display: block; justify-self: center;">
<button type="button" aria-label="Add an inspiration" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; color: #161514;">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</header>

<div aria-hidden="true" style="margin-top: 10px; border-top: 1px solid #161514; height: 3px; border-bottom: 1px solid #161514;"></div>
<div style="display: flex; justify-content: space-between; margin-top: 9px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #6B645C;">
<span>Get the look</span><span>6 inspirations</span>
</div>

<button type="button" style="display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; width: 100%; height: 64px; margin-top: 18px; padding: 0 16px; box-sizing: border-box; border: 1.5px dashed #9A8F7F; border-radius: 4px; background: transparent; color: #161514; text-align: left;">
<span style="font-family: 'Bodoni Moda', serif; font-size: 21px; line-height: 1.1;">Add an inspiration</span>
<span style="font: 400 12px Inter, sans-serif; color: #6B645C;">Or share an image from Instagram or Pinterest</span>
</button>

<div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 22px;">
<h1 style="margin: 0; font-family: 'Bodoni Moda', serif; font-style: italic; font-weight: 400; font-size: 19px;">Inspirations</h1>
<a href="#" style="font-size: 13px; font-weight: 500; color: #9A5E48; text-decoration: none;">See all 6</a>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 10px;">
<sc-for list="{{inspirations}}" as="i" hint-placeholder-count="3">
<a href="{{i.href}}" style="display: flex; flex-direction: column; gap: 6px; color: #161514; text-decoration: none;">
<span style="position: relative; display: block; height: 150px; background: #D3C7B6; overflow: hidden;">
<sc-for list="{{i.pieces}}" as="p" hint-placeholder-count="3">
<svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 100 100" style="{{p.style}}"><path d="{{p.d}}" fill="{{p.fill}}" stroke="{{p.stroke}}" stroke-width="2"></path></svg>
</sc-for>
</span>
<span style="font-size: 13px; font-weight: 500;">{{i.owned}}</span>
<span style="font-size: 11px; color: #6B645C; margin-top: -4px;">{{i.occasion}}</span>
</a>
</sc-for>
</div>

<div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 22px;">
<h2 style="margin: 0; font-family: 'Bodoni Moda', serif; font-style: italic; font-weight: 400; font-size: 19px;">To find</h2>
<span style="font-size: 12px; color: #6B645C;">3 pieces</span>
</div>
<ul style="list-style: none; margin: 8px 0 0; padding: 0;">
<sc-for list="{{toFind}}" as="f" hint-placeholder-count="3">
<li style="display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; gap: 12px; height: 64px; border-top: 1px solid #DCD2C2;">
<span style="{{f.thumbStyle}}">
<sc-if value="{{f.hasThumb}}" hint-placeholder-val="{{true}}">
<svg aria-hidden="true" width="40" height="40" viewBox="0 0 100 100"><path d="{{f.d}}" fill="{{f.fill}}" stroke="{{f.stroke}}" stroke-width="{{f.sw}}"></path></svg>
</sc-if>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
<span style="font-size: 14px; font-weight: 500;">{{f.name}}</span>
<span style="font-size: 12px; color: #6B645C;">{{f.status}}</span>
</span>
<sc-if value="{{f.find}}" hint-placeholder-val="{{false}}">
<button type="button" style="height: 32px; padding: 0 14px; border: 1px solid #9A5E48; border-radius: 16px; background: transparent; color: #9A5E48; font: 600 13px Inter, sans-serif;">Find it</button>
</sc-if>
<sc-if value="{{f.found}}" hint-placeholder-val="{{false}}">
<a href="#" aria-label="See the options for {{f.name}}" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #161514;">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</sc-if>
<sc-if value="{{f.bought}}" hint-placeholder-val="{{false}}">
<button type="button" style="height: 32px; padding: 0 14px; border: 1px solid #161514; border-radius: 16px; background: transparent; color: #161514; font: 600 13px Inter, sans-serif;">Add</button>
</sc-if>
</li>
</sc-for>
</ul>

</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; box-sizing: border-box; padding: 16px 40px 0; display: flex; justify-content: space-between; border-top: 1px solid #161514; background: #F7F2E9;">
<a href="B-Wardrobe.dc.html" style="height: 44px; font-size: 14px; font-weight: 500; color: #6B645C; text-decoration: none;">The edit</a>
<a href="B-Looks.dc.html" style="height: 44px; font-size: 14px; font-weight: 500; color: #6B645C; text-decoration: none;">Looks</a>
<a href="B-GetTheLookHome.dc.html" aria-current="page" style="height: 44px; font-size: 14px; font-weight: 600; color: #161514; text-decoration: underline; text-underline-offset: 6px;">Get the look</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const G = {
      knit: 'M32 13 L42 9 Q50 15 58 9 L68 13 L86 64 L76 67 L68 40 L68 88 L32 88 L32 40 L24 67 L14 64 Z',
      blazer: 'M33 10 L44 7 L50 26 L56 7 L67 10 L82 58 L74 60 L69 40 L70 80 L30 80 L31 40 L26 60 L18 58 Z',
      trousers: 'M31 8 L69 8 L73 94 L56 94 L50 34 L44 94 L27 94 Z',
      skirt: 'M36 14 L64 14 L78 88 L22 88 Z',
      dress: 'M39 6 L44 6 Q50 13 56 6 L61 6 L63 32 L76 92 L24 92 L37 32 Z',
      shoe: 'M12 52 Q13 40 28 40 L52 42 Q68 44 84 51 Q91 54 89 60 L14 60 Q10 58 12 52 Z',
      bag: 'M24 42 L76 42 L80 86 L20 86 Z M36 42 Q36 18 50 18 Q64 18 64 42 L60 42 Q60 23 50 23 Q40 23 40 42 Z',
      hoop: 'M50 20 C 74 20 80 72 50 80 C 20 72 26 20 50 20 Z'
    };
    const place = (k, fill, x, y, s, r, stroke) => ({
      d: G[k], fill, stroke: stroke || 'none',
      style: 'position: absolute; left: ' + x + 'px; top: ' + y + 'px; width: ' + s + 'px; height: ' + s + 'px; transform: rotate(' + r + 'deg); filter: drop-shadow(0 3px 4px rgba(40, 30, 20, 0.22));'
    });
    const inspirations = [
      { owned: '4 of 5 yours', occasion: 'Office', href: 'B-GetTheLook.dc.html', pieces: [
        place('blazer', '#8E8C88', 2, 6, 78, -4), place('trousers', '#3F4F6B', 44, 50, 76, 3), place('shoe', '#1B1A19', 4, 92, 60, -8)] },
      { owned: 'All yours', occasion: 'Night out', href: '#', pieces: [
        place('dress', '#B4765F', 10, 8, 96, -2), place('bag', '#1B1A19', 56, 84, 50, 5)] },
      { owned: '3 of 4 yours', occasion: 'Day out', href: '#', pieces: [
        place('knit', '#EFE6D6', 4, 6, 76, -3, '#B9AE9C'), place('skirt', '#22211F', 46, 48, 70, 4), place('shoe', '#8A5A3C', 4, 96, 56, -6)] }
    ];
    const dashed = 'width: 48px; height: 48px; border-radius: 4px; box-sizing: border-box; border: 1.5px dashed #9A5E48;';
    const tile = 'width: 48px; height: 48px; border-radius: 4px; background: #EFE7DB; display: flex; align-items: center; justify-content: center;';
    const toFind = [
      { name: 'Small black shoulder bag', status: 'In 3 inspirations · not searched yet', find: true, thumbStyle: dashed, hasThumb: false },
      { name: 'Gold hoop earrings', status: '2 options at Arket and COS', found: true, thumbStyle: tile, hasThumb: true, d: G.hoop, fill: 'none', stroke: '#B08A3E', sw: 8 },
      { name: 'Camel suede loafers', status: 'Bought · add it to the edit', bought: true, thumbStyle: tile, hasThumb: true, d: G.shoe, fill: '#B88A5E', stroke: 'none', sw: 0 }
    ].map((f) => ({ ...f, find: !!f.find, found: !!f.found, bought: !!f.bought, d: f.d || '', fill: f.fill || 'none', stroke: f.stroke || 'none', sw: f.sw || 0 }));
    return { inspirations, toFind };
  }
}
</script>
</body>
</html>
