<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding, Adding pieces</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#161514}a:hover{color:#9A5E48}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F7F2E9; color: #161514; font-family: Inter, system-ui, sans-serif;">

<header style="display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 44px; padding: 50px 8px 0;">
<a href="O-Locked.dc.html" aria-label="Close and keep your progress" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #161514;">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<p style="margin: 0; text-align: center; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #6B645C;">Adding pieces</p>
<span aria-hidden="true"></span>
</header>

<div style="padding: 18px 20px 0;">
<h1 style="margin: 0; font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: 30px; line-height: 1.1; letter-spacing: -0.01em;">12 <span style="font-style: italic;">photos</span></h1>
<p style="margin: 8px 0 0; font-size: 14px; line-height: 1.45; color: #6B645C;">Cutting them out and reading the details. You can keep adding while you wait.</p>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 18px;">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="12">
<div style="{{t.tileStyle}}">
<svg aria-hidden="true" width="76" height="76" viewBox="0 0 100 100" style="{{t.svgStyle}}"><path d="{{t.d}}" fill="{{t.fill}}" stroke="{{t.stroke}}" stroke-width="1.5"></path></svg>
<sc-if value="{{t.ready}}" hint-placeholder-val="{{true}}">
<span style="position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 10px; background: #161514; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F7F2E9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
</sc-if>
<sc-if value="{{t.busy}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: 6px; right: 6px; bottom: 6px; padding: 3px 0; border-radius: 3px; background: #F7F2E9; text-align: center; font-size: 11px; font-weight: 500;">{{t.label}}</span>
</sc-if>
</div>
</sc-for>
</div>
<p style="margin: 12px 0 0; font-size: 13px; color: #6B645C;"><span style="font-weight: 600; color: #161514;">7 ready</span> · 3 cutting out · 2 waiting</p>
</div>

<a href="O-Wardrobe.dc.html" style="position: absolute; left: 20px; right: 20px; bottom: 96px; display: flex; align-items: center; justify-content: center; height: 52px; box-sizing: border-box; border: 1px solid #161514; border-radius: 26px; color: #161514; font-size: 15px; font-weight: 500; text-decoration: none;">Add more photos</a>
<a href="O-Review.dc.html" style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 26px; background: #161514; color: #F7F2E9; font-size: 15px; font-weight: 500; text-decoration: none;">Review 7 pieces</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const G = {
      tee: 'M32 14 L43 10 Q50 17 57 10 L68 14 L84 28 L75 38 L68 33 L68 88 L32 88 L32 33 L25 38 L16 28 Z',
      shirt: 'M33 12 L44 8 L50 16 L56 8 L67 12 L84 62 L75 65 L67 38 L67 90 L33 90 L33 38 L25 65 L16 62 Z',
      knit: 'M32 13 L42 9 Q50 15 58 9 L68 13 L86 64 L76 67 L68 40 L68 88 L32 88 L32 40 L24 67 L14 64 Z',
      coat: 'M33 8 L44 5 L50 22 L56 5 L67 8 L82 60 L74 62 L69 42 L71 95 L29 95 L31 42 L26 62 L18 60 Z',
      blazer: 'M33 10 L44 7 L50 26 L56 7 L67 10 L82 58 L74 60 L69 40 L70 80 L30 80 L31 40 L26 60 L18 58 Z',
      trousers: 'M31 8 L69 8 L73 94 L56 94 L50 34 L44 94 L27 94 Z',
      skirt: 'M36 14 L64 14 L78 88 L22 88 Z',
      dress: 'M39 6 L44 6 Q50 13 56 6 L61 6 L63 32 L76 92 L24 92 L37 32 Z',
      shoe: 'M12 52 Q13 40 28 40 L52 42 Q68 44 84 51 Q91 54 89 60 L14 60 Q10 58 12 52 Z',
      bag: 'M24 42 L76 42 L80 86 L20 86 Z M36 42 Q36 18 50 18 Q64 18 64 42 L60 42 Q60 23 50 23 Q40 23 40 42 Z'
    };
    const line = '#CFC6B8';
    const base = 'position: relative; height: 110px; border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; ';
    const raw = [
      ['coat', '#B88A5E', 'ready'], ['shirt', '#FBF9F4', 'ready', line], ['trousers', '#2E3A55', 'ready'],
      ['knit', '#A9A8A3', 'ready'], ['dress', '#22211F', 'ready'], ['shoe', '#22211F', 'ready'],
      ['bag', '#A0703F', 'ready'], ['skirt', '#B4765F', 'cut'], ['tee', '#F6F0E4', 'cut', line],
      ['trousers', '#4A5E7E', 'cut'], ['blazer', '#5A4033', 'wait'], ['knit', '#D8C7A8', 'wait']
    ];
    const tiles = raw.map(([k, fill, state, stroke]) => ({
      d: G[k], fill, stroke: stroke || 'none',
      ready: state === 'ready',
      busy: state !== 'ready',
      label: state === 'cut' ? 'Cutting out' : 'Waiting',
      tileStyle: base + (state === 'ready' ? 'background: #EFE7DB;' : state === 'cut' ? 'background: #C9BFB0;' : 'background: #D9D0C2;'),
      svgStyle: state === 'ready' ? 'filter: drop-shadow(0 3px 4px rgba(70, 50, 30, 0.2));' : state === 'cut' ? '' : 'opacity: 0.55;'
    }));
    return { tiles };
  }
}
</script>
</body>
</html>
