<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spread, Style a look</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#161514}a:hover{color:#9A5E48}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F7F2E9; color: #161514; font-family: Inter, system-ui, sans-serif;">

<header style="display: grid; grid-template-columns: 80px 1fr 80px; align-items: center; height: 44px; padding: 50px 8px 0;">
<a href="B-Piece.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 12px; font-size: 15px; color: #161514; text-decoration: none;">Cancel</a>
<p style="margin: 0; text-align: center; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;">Style a look</p>
<span aria-hidden="true"></span>
</header>

<div style="padding: 10px 20px 0;">
<button type="button" style="display: flex; align-items: center; gap: 8px; padding: 0; border: 0; background: transparent; color: #161514; font-family: 'Bodoni Moda', serif; font-size: 30px; line-height: 1.1; letter-spacing: -0.01em;">A look for the <span style="font-style: italic;">office</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-top: 6px;"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
<button type="button" style="height: 28px; padding: 0 12px; border: 1px solid #161514; border-radius: 14px; background: transparent; color: #161514; font: 500 12px Inter, sans-serif;">Autumn</button>
<span style="font-size: 12px; color: #6B645C;">Started with your camel wool coat</span>
</div>
</div>

<div style="position: absolute; left: 0; top: 194px; width: 390px; height: 362px; border-top: 1px solid #DCD2C2; border-bottom: 1px solid #DCD2C2; background: #EFE7DB;">
<sc-for list="{{pieces}}" as="p" hint-placeholder-count="4">
<div style="{{p.style}}">
<svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 100 100"><path d="{{p.d}}" fill="{{p.fill}}" stroke="{{p.stroke}}" stroke-width="1"></path></svg>
</div>
</sc-for>
<div aria-hidden="true" style="position: absolute; left: 40px; top: 176px; transform: rotate(-4deg); display: flex; align-items: center; gap: 6px; padding: 4px 9px 4px 6px; border: 1px solid #D8CEBF; border-radius: 3px; background: #FBF7F0; font-size: 11px; box-shadow: 0 2px 4px rgba(70, 50, 30, 0.12);">
<span style="width: 5px; height: 5px; border-radius: 3px; border: 1px solid #B9AE9C;"></span>Your starting piece</div>
<button type="button" style="position: absolute; left: 30px; top: 236px; width: 112px; height: 84px; box-sizing: border-box; border: 1.5px dashed #9A8F7F; border-radius: 10px; background: transparent; color: #6B645C; font: 500 12px Inter, sans-serif;">+ Bag</button>
<p style="position: absolute; left: 214px; top: 244px; margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #9A5E48;">Shoes</p>
<div aria-hidden="true" style="position: absolute; left: 210px; top: 264px; width: 138px; height: 56px; box-sizing: border-box; border: 1.5px dashed #9A5E48; border-radius: 10px;"></div>
</div>

<nav aria-label="Slots" style="position: absolute; left: 20px; right: 0; top: 574px; display: flex; gap: 16px; overflow: hidden;">
<a href="#" style="flex: 0 0 auto; font-size: 13px; font-weight: 500; color: #6B645C; text-decoration: none;">Outer layer</a>
<a href="#" style="flex: 0 0 auto; font-size: 13px; font-weight: 500; color: #6B645C; text-decoration: none;">Top</a>
<a href="#" style="flex: 0 0 auto; font-size: 13px; font-weight: 500; color: #6B645C; text-decoration: none;">Bottom</a>
<a href="#" aria-current="true" style="flex: 0 0 auto; font-size: 13px; font-weight: 600; color: #161514; text-decoration: underline; text-underline-offset: 5px;">Shoes</a>
<a href="#" style="flex: 0 0 auto; font-size: 13px; font-weight: 500; color: #6B645C; text-decoration: none;">Bag</a>
<a href="#" style="flex: 0 0 auto; font-size: 13px; font-weight: 500; color: #6B645C; text-decoration: none;">Accessories</a>
</nav>

<section aria-label="Choose shoes" style="position: absolute; left: 20px; right: 20px; top: 608px;">
<p style="margin: 0 0 8px; font-size: 12px; color: #6B645C;">Your shoes for autumn · 4</p>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;">
<sc-for list="{{tray}}" as="t" hint-placeholder-count="4">
<button type="button" aria-label="{{t.name}}" aria-pressed="{{t.pressed}}" style="{{t.style}}">
<svg aria-hidden="true" width="62" height="62" viewBox="0 0 100 100"><path d="{{t.d}}" fill="{{t.fill}}" stroke="{{t.stroke}}" stroke-width="1.5"></path></svg>
</button>
</sc-for>
</div>
</section>

<button type="button" style="position: absolute; left: 20px; right: 20px; bottom: 34px; height: 52px; border: 0; border-radius: 26px; background: #161514; color: #F7F2E9; font: 500 15px Inter, sans-serif;">Save look</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const G = {
      shirt: 'M33 12 L44 8 L50 16 L56 8 L67 12 L84 62 L75 65 L67 38 L67 90 L33 90 L33 38 L25 65 L16 62 Z',
      coat: 'M33 8 L44 5 L50 22 L56 5 L67 8 L82 60 L74 62 L69 42 L71 95 L29 95 L31 42 L26 62 L18 60 Z',
      trousers: 'M31 8 L69 8 L73 94 L56 94 L50 34 L44 94 L27 94 Z',
      shoe: 'M12 52 Q13 40 28 40 L52 42 Q68 44 84 51 Q91 54 89 60 L14 60 Q10 58 12 52 Z'
    };
    const shadow = ' filter: drop-shadow(0 8px 9px rgba(70, 50, 30, 0.22));';
    const place = (k, fill, x, y, s, r, stroke) => ({
      d: G[k], fill, stroke: stroke || 'none',
      style: 'position: absolute; left: ' + x + 'px; top: ' + y + 'px; width: ' + s + 'px; height: ' + s + 'px; transform: rotate(' + r + 'deg);' + shadow
    });
    const pieces = [
      place('shirt', '#FBF9F4', 156, 2, 134, 3, '#D8CEBF'),
      place('coat', '#B88A5E', 18, -2, 196, -4),
      place('trousers', '#2E3A55', 188, 92, 186, 2),
      place('shoe', '#22211F', 214, 228, 130, -6)
    ];
    const tile = 'height: 74px; padding: 0; border-radius: 10px; background: #EFE7DB; display: flex; align-items: center; justify-content: center; box-sizing: border-box; ';
    const tray = [
      { name: 'Black loafers', fill: '#22211F', on: true },
      { name: 'Tan loafers', fill: '#8A5A3C' },
      { name: 'Cream trainers', fill: '#F3ECE0', stroke: '#B9AE9C' },
      { name: 'Brown suede loafers', fill: '#5A4033' }
    ].map((t) => ({
      ...t,
      d: G.shoe,
      stroke: t.stroke || 'none',
      pressed: t.on ? 'true' : 'false',
      style: tile + (t.on ? 'border: 2px solid #161514;' : 'border: 1px solid #DCD2C2;')
    }));
    return { pieces, tray };
  }
}
</script>
</body>
</html>
