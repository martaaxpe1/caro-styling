<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding, Your year</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#161514}a:hover{color:#9A5E48}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F7F2E9; color: #161514; font-family: Inter, system-ui, sans-serif;">

<div style="padding: 50px 8px 0;">
<div style="display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 44px;">
<a href="O-Place.dc.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #161514;">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<p style="margin: 0; text-align: center; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #6B645C;">Step 3 of 6</p>
<span aria-hidden="true"></span>
</div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; margin: 6px 12px 0;">
<span style="height: 2px; background: #161514;"></span><span style="height: 2px; background: #161514;"></span><span style="height: 2px; background: #161514;"></span><span style="height: 2px; background: #DCD2C2;"></span><span style="height: 2px; background: #DCD2C2;"></span><span style="height: 2px; background: #DCD2C2;"></span>
</div>
</div>

<div style="padding: 28px 20px 0;">
<h1 style="margin: 0; font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: 32px; line-height: 1.1; letter-spacing: -0.01em;">Your <span style="font-style: italic;">year</span></h1>
<p style="margin: 10px 0 0; font-size: 14px; line-height: 1.45; color: #6B645C;">Proposed from Miami's typical weather. Tap a month to move it to another season.</p>

<div role="group" aria-label="How many seasons" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 20px; border: 1px solid #161514; border-radius: 4px; overflow: hidden;">
<button type="button" aria-pressed="false" style="height: 40px; border: 0; border-right: 1px solid #161514; background: transparent; color: #161514; font: 500 14px Inter, sans-serif;">Four seasons</button>
<button type="button" aria-pressed="true" style="height: 40px; border: 0; border-right: 1px solid #161514; background: #161514; color: #F7F2E9; font: 500 14px Inter, sans-serif;">Two seasons</button>
<button type="button" aria-pressed="false" style="height: 40px; border: 0; background: transparent; color: #161514; font: 500 14px Inter, sans-serif;">No seasons</button>
</div>

<figure style="margin: 24px 0 0;">
<div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; align-items: end; height: 150px;">
<sc-for list="{{months}}" as="m" hint-placeholder-count="12">
<button type="button" aria-label="{{m.label}}" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 150px; padding: 0; border: 0; background: transparent; color: #6B645C; font: 400 10px Inter, sans-serif;">{{m.t}}<span style="{{m.barStyle}}"></span></button>
</sc-for>
</div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; margin-top: 6px; border-top: 1px solid #161514; padding-top: 6px;">
<sc-for list="{{months}}" as="m" hint-placeholder-count="12">
<span style="text-align: center; font-size: 12px; font-weight: 500;">{{m.m}}</span>
</sc-for>
</div>
<figcaption style="margin-top: 6px; font-size: 11px; color: #6B645C;">Typical daily high, °F</figcaption>
</figure>

<ul style="list-style: none; margin: 18px 0 0; padding: 0;">
<li style="display: grid; grid-template-columns: 14px minmax(0, 1fr) 44px; align-items: center; gap: 12px; height: 54px; border-top: 1px solid #DCD2C2;">
<span aria-hidden="true" style="width: 14px; height: 14px; background: #B4765F;"></span>
<span style="display: flex; flex-direction: column;"><span style="font-family: 'Bodoni Moda', serif; font-size: 19px;">Hot and rainy</span><span style="font-size: 12px; color: #6B645C;">May to October</span></span>
<button type="button" aria-label="Rename hot and rainy" style="width: 44px; height: 44px; border: 0; background: transparent; color: #161514; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
</li>
<li style="display: grid; grid-template-columns: 14px minmax(0, 1fr) 44px; align-items: center; gap: 12px; height: 54px; border-top: 1px solid #DCD2C2; border-bottom: 1px solid #DCD2C2;">
<span aria-hidden="true" style="width: 14px; height: 14px; background: #D9B986;"></span>
<span style="display: flex; flex-direction: column;"><span style="font-family: 'Bodoni Moda', serif; font-size: 19px;">Mild and dry</span><span style="font-size: 12px; color: #6B645C;">November to April</span></span>
<button type="button" aria-label="Rename mild and dry" style="width: 44px; height: 44px; border: 0; background: transparent; color: #161514; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
</li>
</ul>

<p style="margin: 16px 0 0; font-size: 14px;"><span style="font-weight: 600;">Now:</span> hot and rainy, until the end of October.</p>
</div>

<a href="O-Stores.dc.html" style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 26px; background: #161514; color: #F7F2E9; font-size: 15px; font-weight: 500; text-decoration: none;">Continue</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const highs = [76, 78, 80, 83, 87, 90, 91, 91, 89, 86, 81, 78];
    const months = names.map((name, i) => {
      const hot = i >= 4 && i <= 9;
      return {
        m: name[0],
        t: highs[i],
        label: name + ', ' + (hot ? 'hot and rainy' : 'mild and dry'),
        barStyle: 'display: block; width: 100%; height: ' + ((highs[i] - 60) * 4) + 'px; background: ' + (hot ? '#B4765F' : '#D9B986') + ';'
      };
    });
    return { months };
  }
}
</script>
</body>
</html>
