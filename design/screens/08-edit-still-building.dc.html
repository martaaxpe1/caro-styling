<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding, The edit while building</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#161514}a:hover{color:#9A5E48}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F7F2E9; color: #161514; font-family: Inter, system-ui, sans-serif;">
<div style="padding: 50px 20px 0;">

<header style="display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 44px;">
<button type="button" aria-label="Profile and settings" style="width: 34px; height: 34px; border-radius: 17px; border: 1px solid #161514; background: transparent; font: 500 13px Inter, sans-serif; color: #161514;">S</button>
<img src="/_blob/a841e02b9fa8bb0deeffbfafaa1b670a" alt="Caro" style="height: 28px; width: auto; display: block; justify-self: center;">
<a href="O-Wardrobe.dc.html" aria-label="Add pieces" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #161514;">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</a>
</header>

<div aria-hidden="true" style="margin-top: 10px; border-top: 1px solid #161514; height: 3px; border-bottom: 1px solid #161514;"></div>
<div style="display: flex; justify-content: space-between; margin-top: 9px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #6B645C;">
<span>The edit</span><span>12 pieces</span>
</div>

<section aria-label="Your progress" style="margin-top: 18px; padding: 16px; border: 1px solid #161514; border-radius: 4px;">
<div style="display: flex; justify-content: space-between; align-items: baseline;">
<p style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 30px; line-height: 1;">12 <span style="font-style: italic;">of</span> 20</p>
<p style="margin: 0; font-size: 12px; color: #6B645C;">8 to go</p>
</div>
<div aria-hidden="true" style="height: 4px; margin-top: 12px; background: #DCD2C2;"><div style="width: 60%; height: 4px; background: #161514;"></div></div>
<ul style="list-style: none; margin: 12px 0 0; padding: 0; display: flex; gap: 14px; font-size: 13px;">
<li style="display: flex; align-items: center; gap: 5px;"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#161514" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>A top</li>
<li style="display: flex; align-items: center; gap: 5px;"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#161514" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>A bottom</li>
<li style="display: flex; align-items: center; gap: 5px; color: #9A5E48;"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; border: 1px solid #9A5E48;"></span>Shoes still missing</li>
</ul>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px;">
<p style="margin: 0; font-size: 12px; line-height: 1.4; color: #6B645C;">Looks and Get the look open at 20.</p>
<a href="O-Wardrobe.dc.html" style="flex: 0 0 auto; display: flex; align-items: center; height: 40px; padding: 0 18px; border-radius: 20px; background: #161514; color: #F7F2E9; font-size: 14px; font-weight: 500; text-decoration: none;">Add pieces</a>
</div>
</section>

<nav aria-label="Chapters" style="margin-top: 14px;">
<sc-for list="{{chapters}}" as="c" hint-placeholder-count="4">
<a href="#" style="display: grid; grid-template-columns: 50px minmax(0, 1fr) 112px; align-items: center; height: 76px; border-bottom: 1px solid #DCD2C2; color: #161514; text-decoration: none;">
<span style="font-family: 'Bodoni Moda', serif; font-size: 30px; line-height: 1;">{{c.num}}</span>
<span style="display: flex; flex-direction: column; gap: 3px;">
<span style="font-family: 'Bodoni Moda', serif; font-size: 21px; line-height: 1.15;">{{c.name}}</span>
<span style="font-size: 12px; color: #6B645C;">{{c.meta}}</span>
</span>
<span aria-hidden="true" style="display: flex; justify-content: flex-end;">
<sc-for list="{{c.pieces}}" as="p" hint-placeholder-count="2">
<svg width="48" height="48" viewBox="0 0 100 100" style="margin-left: -12px; filter: drop-shadow(0 3px 4px rgba(60, 40, 20, 0.18));"><path d="{{p.d}}" fill="{{p.fill}}" stroke="{{p.stroke}}" stroke-width="1.5"></path></svg>
</sc-for>
</span>
</a>
</sc-for>
</nav>

</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; box-sizing: border-box; padding: 16px 40px 0; display: flex; justify-content: space-between; border-top: 1px solid #161514; background: #F7F2E9;">
<a href="#" aria-current="page" style="height: 44px; font-size: 14px; font-weight: 600; color: #161514; text-decoration: underline; text-underline-offset: 6px;">The edit</a>
<a href="#" aria-disabled="true" aria-label="Looks, opens at 20 pieces" style="display: flex; align-items: flex-start; gap: 5px; height: 44px; font-size: 14px; font-weight: 500; color: #6B645C; text-decoration: none;">
<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top: 2px;"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>Looks</a>
<a href="#" aria-disabled="true" aria-label="Get the look, opens at 20 pieces" style="display: flex; align-items: flex-start; gap: 5px; height: 44px; font-size: 14px; font-weight: 500; color: #6B645C; text-decoration: none;">
<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top: 2px;"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>Get the look</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const G = {
      tee: 'M32 14 L43 10 Q50 17 57 10 L68 14 L84 28 L75 38 L68 33 L68 88 L32 88 L32 33 L25 38 L16 28 Z',
      shirt: 'M33 12 L44 8 L50 16 L56 8 L67 12 L84 62 L75 65 L67 38 L67 90 L33 90 L33 38 L25 65 L16 62 Z',
      knit: 'M32 13 L42 9 Q50 15 58 9 L68 13 L86 64 L76 67 L68 40 L68 88 L32 88 L32 40 L24 67 L14 64 Z',
      coat: 'M33 8 L44 5 L50 22 L56 5 L67 8 L82 60 L74 62 L69 42 L71 95 L29 95 L31 42 L26 62 L18 60 Z',
      blazer: 'M33 10 L44 7 L50 26 L56 7 L67 10 L82 58 L74 60 L69 40 L70 80 L30 80 L31 40 L26 60 L18 58 Z',
      trousers: 'M31 8 L69 8 L73 94 L56 94 L50 34 L44 94 L27 94 Z',
      skirt: 'M36 14 L64 14 L78 88 L22 88 Z'

    const line = '#CFC6B8';
    const p = (k, fill, stroke) => ({ d: G[k], fill, stroke: stroke || 'none' });
    const chapters = [
      { num: '01', name: 'Outerwear', meta: '2 pieces', pieces: [p('coat', '#B88A5E'), p('blazer', '#5A4033')] },
      { num: '02', name: 'Knitwear', meta: '2 pieces', pieces: [p('knit', '#A9A8A3'), p('knit', '#D8C7A8')] },
      { num: '03', name: 'Shirts and tops', meta: '5 pieces', pieces: [p('shirt', '#FBF9F4', line), p('tee', '#F6F0E4', line)] },
      { num: '04', name: 'Trousers and skirts', meta: '3 pieces', pieces: [p('trousers', '#2E3A55'), p('skirt', '#B4765F')] }
    ];
    return { chapters };
  }
}
</script>
</body>
</html>
